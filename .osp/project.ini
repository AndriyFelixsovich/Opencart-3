[opencart3.local]

enabled           = on
environment       = System
ip                = auto
nginx_engine      = nginx-1.19
node_engine       = node-14
php_engine        = PHP-7.4
project_dir       = {base_dir}
project_url       = https://{host_decoded}
public_dir        = {base_dir}
ssl               = on
ssl_cert_file     = auto
ssl_key_file      = auto
start_command     =

